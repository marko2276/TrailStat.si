name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run all linters and tests
        run: ./scripts/check.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Make e2e folders writable for the test container
        run: chmod -R a+rwX e2e
      - name: Run end-to-end tests in real browsers
        run: ./scripts/e2e.sh
      - name: Keep screenshots and traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/results/
          retention-days: 7

  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prove that a backup can be restored
        run: ./scripts/test-backup.sh
