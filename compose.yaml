# Production-like stack. For local development see docs/development.md.
name: trailstat

x-backend-environment: &backend-environment
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:-trailstat}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-trailstat}
  HANKO_API_URL: ${HANKO_API_URL:-}
  HANKO_AUDIENCE: ${HANKO_AUDIENCE:-}
  DEM_DIR: /data/dem
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-TrailStat <noreply@trailstat.si>}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trailstat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trailstat}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies database migrations, then exits. The backend starts after it succeeds.
  migrate:
    build:
      context: ./backend
      target: prod
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment: *backend-environment
    volumes:
      - ${DEM_DIR:-./data/dem}:/data/dem:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_HANKO_API_URL: ${HANKO_API_URL:-}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - ${HTTP_PORT:-8080}:80
      - ${HTTPS_PORT:-8443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  caddy_data:
  caddy_config:
