# TEST ONLY: the production build of the app, with stand-ins for Hanko, Overpass and the mail
# server, and synthetic elevation data. See scripts/e2e.sh.
services:
  mock-hanko:
    image: node:22-alpine
    command: ["node", "/srv/server.mjs"]
    volumes:
      - ./e2e/mock-hanko/server.mjs:/srv/server.mjs:ro
      - ./backend/tests/fixtures/overpass_relation_19446684.json:/srv/overpass_relation.json:ro
    ports:
      - 127.0.0.1:${E2E_HANKO_PORT:-14000}:4000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4000/.well-known/jwks.json"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - 127.0.0.1:${E2E_MAILPIT_PORT:-18025}:8025

  backend:
    environment:
      # The stand-ins here are what production refuses: no SMTP, no audience, plain HTTP.
      ENVIRONMENT: development
      HANKO_API_URL: http://mock-hanko:4000
      OVERPASS_URL: http://mock-hanko:4000/api/interpreter
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_USER: ""
      APP_URL: http://localhost:${E2E_APP_PORT:-18080}
      # The example account of the UPN QR documentation.
      DONATION_IBAN: SI56 0201 7001 4356 205
      DONATION_NAME: Planinsko društvo Test
      DONATION_CITY: 1000 Ljubljana
      DONATION_FLIK_NUMBER: "+386 41 000 000"
      # The stand-in's user ID for admin@example.com: the first 32 hex digits of its SHA-256.
      ADMIN_USER_IDS: 258d8dc916db8cea2cafb6c3cd0cb024
      APP_VERSION: e2e
    depends_on:
      mock-hanko:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      args:
        VITE_HANKO_API_URL: http://localhost:${E2E_HANKO_PORT:-14000}

  caddy:
    environment:
      # The browser reaches the stand-in for Hanko here (VITE_HANKO_API_URL above).
      HANKO_ORIGIN: http://localhost:${E2E_HANKO_PORT:-14000}
